auth:
  data_dir: "~/.pico-auth"
  access_token_expire_minutes: 15
  refresh_token_expire_days: 7
  issuer: "http://localhost:8100"
  audience: "pico-bot"
  algorithm: "RS256"
  # Bootstrapping an admin needs a real password: startup fails fast rather
  # than stand up a known-credential account. Mount your own application.yaml
  # (or edit this one) with auto_create_admin: true and a strong password.
  auto_create_admin: false
  admin_email: "admin@pico.local"
  admin_password: ""
  registration_enabled: true

database:
  url: "sqlite+aiosqlite:///auth.db"
  echo: false

auth_client:
  enabled: true
  issuer: "http://localhost:8100"
  audience: "pico-bot"
  accepted_algorithms:
    - "RS256"
    - "ML-DSA-65"
    - "ML-DSA-87"

fastapi:
  title: "Pico Auth API"
  version: "0.2.0"
